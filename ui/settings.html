<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ajustes · Dynamic Island</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body>
  <main>
    <h1>Ajustes</h1>

    <section>
      <label class="row">
        <span class="text"><b>Iniciar con Windows</b><small>Se abre oculta al iniciar sesión.</small></span>
        <input type="checkbox" role="switch" id="autostart">
      </label>
      <label class="row">
        <span class="text"><b>Auto-ocultar</b><small>Se esconde cuando no hay nada que mostrar.</small></span>
        <input type="checkbox" role="switch" id="autohide">
      </label>
      <label class="row">
        <span class="text"><b>Ocultar tras</b><small>Segundos sin actividad.</small></span>
        <input type="number" id="hide_secs" min="2" max="3600" step="1" inputmode="numeric">
      </label>
    </section>

    <section>
      <label class="row">
        <span class="text"><b>Música</b><small>Carátula, letra y controles de lo que está sonando.</small></span>
        <input type="checkbox" role="switch" id="music">
      </label>
      <label class="row">
        <span class="text"><b>Letra sincronizada</b><small>Consulta lrclib.net con el título y el artista.</small></span>
        <input type="checkbox" role="switch" id="lyrics">
      </label>
      <label class="row">
        <span class="text"><b>Color de la carátula de fondo</b><small>Tiñe el notch con los colores del álbum.</small></span>
        <input type="checkbox" role="switch" id="art_color">
      </label>
      <label class="row">
        <span class="text"><b>Ecualizador animado</b></span>
        <input type="checkbox" role="switch" id="eq">
      </label>
    </section>

    <section>
      <label class="row">
        <span class="text"><b>Integración con Claude Code</b><small id="claude-note">Buscando instalaciones…</small></span>
        <input type="checkbox" role="switch" id="claude" disabled>
      </label>
      <div id="claude-extra">
        <div class="row">
          <span class="text"><b>Estado</b><small id="claude-status"></small></span>
        </div>
        <div class="row">
          <span class="text"><b>Hooks de Claude Code</b><small id="hooks-status"></small></span>
          <button type="button" id="reinstall">Reinstalar</button>
        </div>
        <label class="row">
          <span class="text"><b>Mientras trabaja</b><small>Indicador con el tiempo que lleva.</small></span>
          <input type="checkbox" role="switch" id="claude_working">
        </label>
        <label class="row">
          <span class="text"><b>Cuando termina</b><small>Muestra el final de su respuesta.</small></span>
          <input type="checkbox" role="switch" id="claude_done">
        </label>
        <label class="row">
          <span class="text"><b>Cuando necesita tu permiso</b><small>Avisa y no se oculta hasta que respondas.</small></span>
          <input type="checkbox" role="switch" id="claude_permission">
        </label>
        <label class="row">
          <span class="text"><b>Sonido al terminar</b><small>Cuando Claude termina una respuesta.</small></span>
          <input type="checkbox" role="switch" id="sound">
        </label>
        <div class="row">
          <span class="text"><b>Sesiones activas</b><small id="sessions">Ninguna.</small></span>
        </div>
      </div>
    </section>

    <section>
      <div class="row">
        <span class="text"><b>Mostrar notificaciones en</b><small id="notif-note">En el notch, Windows deja de mostrar el aviso de la esquina y su sonido (se restaura al volver a Windows). Siguen en el centro de notificaciones.</small></span>
        <select id="notif_target"><option value="windows">Windows</option><option value="notch">Notch</option></select>
      </div>
      <div class="row" id="notif-apps-row">
        <span class="text"><b>Apps</b><small>Desmarca las que prefieras dejar en Windows.</small><span id="notif-apps"></span></span>
      </div>
    </section>

    <section>
      <label class="row">
        <span class="text"><b>Volumen y brillo</b><small>Aparece solo cuando los cambias.</small></span>
        <input type="checkbox" role="switch" id="sys_volume">
      </label>
      <label class="row">
        <span class="text"><b>Batería</b><small>Cargador conectado y batería baja.</small></span>
        <input type="checkbox" role="switch" id="sys_battery">
      </label>
      <label class="row">
        <span class="text"><b>Dispositivos Bluetooth</b><small>Al conectarse, con su batería aproximada.</small></span>
        <input type="checkbox" role="switch" id="sys_bluetooth">
      </label>
    </section>

    <section>
      <label class="row">
        <span class="text"><b>Compartir archivos</b><small>Arrastra un archivo al notch y pásalo al teléfono con un QR.</small></span>
        <input type="checkbox" role="switch" id="drop">
      </label>
    </section>

    <section>
      <label class="row">
        <span class="text"><b>Modo focus</b><small>Temporizador de concentración. Se inicia desde la bandeja o desde el notch.</small></span>
        <input type="checkbox" role="switch" id="focus">
      </label>
      <label class="row">
        <span class="text"><b>Concentración</b><small>Minutos.</small></span>
        <input type="number" id="focus_work" min="1" max="180" step="1" inputmode="numeric">
      </label>
      <label class="row">
        <span class="text"><b>Descanso</b><small>Minutos.</small></span>
        <input type="number" id="focus_break" min="1" max="180" step="1" inputmode="numeric">
      </label>
      <label class="row">
        <span class="text"><b>Descanso largo</b><small>Minutos, cada 4 ciclos.</small></span>
        <input type="number" id="focus_long" min="1" max="180" step="1" inputmode="numeric">
      </label>
    </section>

    <p class="error" id="error" role="alert"></p>
  </main>
</body>
</html>
