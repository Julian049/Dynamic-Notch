<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Dynamic Island</title>
  <link rel="stylesheet" href="style.css">
  <script src="lyrics.js" defer></script>
  <script src="art.js" defer></script>
  <script src="summary.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="notch" id="notch">
    <div class="shape">
      <!-- One line, rebuilt by compactView() in main.js: lead (icon/cover) · text · equalizer · trail. -->
      <div class="compact" id="compact">
        <span class="slot" id="lead"></span>
        <div class="marquee" id="marquee"><span id="line"><span id="line-main"></span><span id="line-sub"></span></span></div>
        <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="slot" id="trail"></span>
      </div>

      <div class="full" id="full">
        <!-- placeholder: crude on purpose until the Figma redesign -->
        <div id="drag-hint" hidden style="font-size:20px;padding:16px 0;text-align:center">SUÉLTALO AQUÍ</div>
        <!-- Expanded views (Figma "Size=Expanded"): render() shows one, picked by pickView() in main.js.
             The mode chips (#chips) move into the .chip-slot of the view on screen. -->
        <div class="media view" id="media" hidden>
          <div class="glow" id="glow"></div>
          <div class="top-fade"></div>
          <div class="media-main">
            <div class="art-box"><img id="art" alt="" hidden></div>
            <div class="media-right">
              <div class="vhead">
                <div class="meta"><div class="title" id="title"></div><div class="sub" id="artist"></div></div>
                <span class="chip-slot"></span>
              </div>
              <div class="lyrics" id="lyrics" hidden>
                <p id="ly-prev"></p>
                <p id="ly-cur" class="cur"></p>
                <p id="ly-next"></p>
              </div>
            </div>
          </div>
          <div class="progress" id="progress" hidden>
            <span id="elapsed"></span><span class="track"><i id="bar"></i></span><span id="remaining"></span>
          </div>
          <div class="controls">
            <button id="prev" aria-label="Anterior"><img src="icons/notch-next.svg" width="24" height="24" alt="" class="flip"></button>
            <button id="toggle" aria-label="Reproducir o pausar"><img id="toggle-icon" src="icons/notch-play.svg" width="32" height="32" alt=""></button>
            <button id="next" aria-label="Siguiente"><img src="icons/notch-next.svg" width="24" height="24" alt=""></button>
          </div>
        </div>

        <div class="claude view" id="claude" hidden>
          <div class="vhead">
            <span class="avatar" id="claude-avatar"><img src="icons/notch-claude.svg" width="24.2" height="17.6" alt=""></span>
            <div class="meta"><div class="title" id="claude-title"></div><div class="sub" id="claude-sub"></div></div>
            <span class="chip-slot"></span>
          </div>
          <div class="card" id="claude-body"></div>
        </div>

        <div class="focus view" id="focus" hidden>
          <div class="vhead">
            <span class="avatar"><img src="icons/notch-moon.svg" width="20" height="20" alt=""></span>
            <div class="meta"><div class="title" id="focus-phase"></div><div class="sub" id="focus-sub"></div></div>
            <span class="chip-slot"></span>
          </div>
          <div class="timer">
            <div class="time"><span id="focus-time"></span><span class="of" id="focus-of"></span></div>
            <span class="track focus-track"><i id="focus-bar"></i></span>
          </div>
          <div class="actions">
            <button class="pill primary" id="focus-pause">Pausar</button>
            <button class="pill" id="focus-stop">Terminar</button>
            <button class="pill primary" id="focus-start">Iniciar</button>
          </div>
        </div>

        <div class="batteries view" id="batteries" hidden></div>

        <div class="notif" id="notif" hidden>
          <img class="notif-icon" id="notif-icon" alt="">
          <div class="notif-text">
            <div class="notif-app" id="notif-app"></div>
            <b id="notif-title"></b>
            <div id="notif-body"></div>
          </div>
        </div>

        <div class="drop" id="drop" hidden>
          <div class="qr" id="qr"></div>
          <div class="drop-info">
            <div class="drop-title">Escanea con el celular</div>
            <div class="drop-files" id="drop-url" style="user-select:text"></div>
            <div class="drop-files" id="drop-files"></div>
            <div class="drop-note" id="drop-note"></div>
            <div class="drop-note">¿No abre en Android? Dale al navegador el permiso de red local (Ajustes › Apps › navegador › Permisos).</div>
            <button class="text-btn" id="drop-close">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
