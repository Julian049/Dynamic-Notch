[package]
name = "dynamic-island"
version = "0.10.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Already in the tree via tauri/wry; used to receive dropped file paths from WebView2 (drop.rs).
webview2-com = "0.39"
windows-core = "0.62"
# Same major as `windows` 0.61, whose WinRT APIs take its IIterable.
windows-collections = "0.2"
windows-registry = "0.6"
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting the user's settings.json must keep its key order.
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
# bundled: rusqlite has no `winsqlite3` feature (only libsqlite3-sys does); reads wpndatabase.db (notify.rs).
rusqlite = { version = "0.43", features = ["bundled"] }
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
windows = { version = "0.61", features = [
    "Media_Control",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Wmi",
    "Win32_System_Power",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Devices_Enumeration",
    "Devices_Power",
    "Foundation_Collections",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
] }

[profile.release]
strip = true
