[package]
name = "dynamic-island"
version = "0.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Already in the tree via tauri/wry; used to receive dropped file paths from WebView2 (drop.rs).
webview2-com = "0.39"
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting the user's settings.json must keep its key order.
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
windows = { version = "0.61", features = [
    "Media_Control",
    "Foundation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
strip = true
